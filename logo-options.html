<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyJournal — logo</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fa;color:#18222f;padding:24px}
h1{font-size:1.3rem;margin:0 0 4px} p.lead{margin:0 0 20px;color:#586578}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{border-radius:12px;padding:20px;border:1px solid #dfe5ee}
.panel.light{background:#fff;color:#18222f}.panel.dark{background:#0b0b0c;color:#e7eef6;border-color:#33363d}
.row{display:flex;gap:16px;align-items:center;margin-top:12px}
.name{font-weight:700;font-size:1.25rem}
img{display:block}
</style></head><body>
<h1>Logo EasyJournal : carnet et courbe</h1>
<p class="lead">Dessin rouge, contour blanc quand le navigateur est en mode clair, noir quand il est en mode sombre. Les deux versions sont montrées ici ; l'application et l'onglet du navigateur choisissent automatiquement.</p>
<div class="grid">
<section class="panel light"><strong>Mode clair</strong><div class="row"><img src="assets/logo-light.svg" width="112" height="112" alt=""><img src="assets/logo-light.svg" width="32" height="32" alt=""><img src="assets/logo-light.svg" width="16" height="16" alt=""></div><div class="row"><img src="assets/logo-light.svg" width="30" height="30" alt=""><span class="name">EasyJournal</span></div></section>
<section class="panel dark"><strong>Mode sombre</strong><div class="row"><img src="assets/logo-dark.svg" width="112" height="112" alt=""><img src="assets/logo-dark.svg" width="32" height="32" alt=""><img src="assets/logo-dark.svg" width="16" height="16" alt=""></div><div class="row"><img src="assets/logo-dark.svg" width="30" height="30" alt=""><span class="name">EasyJournal</span></div></section>
</div></body></html>
